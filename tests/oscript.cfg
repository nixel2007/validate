# Зависимости проекта, установленные локально через opm install -l.
#
# Второй каталог - поставка OneUnit: opm разворачивает рядом с проектом только
# прямые зависимости пакета, а транзитивные остаются внутри его поставки,
# поэтому без этого пути дочерний процесс OneUnit их не найдёт.
# Пока OneUnit не установлен, каталога нет - несуществующие пути игнорируются.
lib.additional=../oscript_modules;../oscript_modules/oneunit/oscript_modules
